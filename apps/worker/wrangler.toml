name = "ppm-worker"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "ppm-production"
database_id = "9bbc5321-cad3-41f3-af6d-4950aed63f6f"
migrations_dir = "src/db/migrations"

[[kv_namespaces]]
binding = "KV_CACHE"
id = "dc5eb2221acc414182a635a5d78cb0e5"

# R2 and Queues enabled in Phase 6 (file attachments, PDF reports)
# Enable via Cloudflare dashboard then uncomment:
# [[r2_buckets]]
# binding = "R2_FILES"
# bucket_name = "ppm-files"

[triggers]
crons = ["0 * * * *"]

[vars]
ENVIRONMENT = "production"
JWT_EXPIRY = "86400"
ASANA_REDIRECT_URI = "https://ppm-worker.almazor-schwab.workers.dev/api/import/asana/callback"
# Email (non-secret). Sending stays disabled until RESEND_API_KEY secret is set.
EMAIL_FROM = "PPM Tool <onboarding@resend.dev>"
APP_URL = "https://ppm-tool.pages.dev"
SIGNUP_NOTIFY_EMAIL = ""
VAPID_SUBJECT = "mailto:admin@ppm-tool.app"
# VAPID_PUBLIC_KEY can also be a var; set together with the private key below.

# Secrets — set via wrangler CLI:
#   wrangler secret put JWT_SECRET
#   wrangler secret put JWT_SECRET_PREVIOUS   (during rotation only)
#   wrangler secret put ASANA_CLIENT_ID
#   wrangler secret put ASANA_CLIENT_SECRET
#   wrangler secret put RESEND_API_KEY        (enables email sending)
#   wrangler secret put VAPID_PUBLIC_KEY      (base64url raw 65-byte P-256 public key)
#   wrangler secret put VAPID_PRIVATE_KEY     (base64url raw 32-byte P-256 private scalar; enables Web Push)
